name: API repeatability
on: [push, pull_request, workflow_dispatch]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - name: Start isolated bank
        run: docker compose -f api-tests/docker-compose.yml up -d --wait
      - name: Framework unit tests
        run: chmod +x api-tests/mvnw && api-tests/mvnw -f api-tests/pom.xml test
      - name: Repeat with recorded random-order seeds
        shell: bash
        run: |
          failed=0
          for seed in 42 43; do
            api-tests/mvnw -f api-tests/pom.xml -Pintegration -Dseed="$seed" clean test || failed=1
            mkdir -p "results/api-${seed}"
            cp -r api-tests/target/surefire-reports api-tests/target/allure-results "results/api-${seed}/"
            rm -rf api-tests/target/surefire-reports api-tests/target/allure-results
          done
          api-tests/mvnw -f api-tests/pom.xml -Dgroups=loans clean test || failed=1
          mkdir -p results/loans && cp -r api-tests/target/surefire-reports api-tests/target/allure-results results/loans/
          api-tests/mvnw -f api-tests/pom.xml -Dgroups=reset clean test || failed=1
          mkdir -p results/reset && cp -r api-tests/target/surefire-reports api-tests/target/allure-results results/reset/
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: api-evidence, path: results/}
      - name: Remove owned ephemeral data
        if: always()
        run: docker compose -f api-tests/docker-compose.yml down -v
