name: UI browser reliability
on: [push, pull_request, workflow_dispatch]
jobs:
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {browser: [chrome, firefox]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - name: Provision disposable store
        run: |
          source scripts/configure.sh
          docker compose -f ui-automation/docker-compose.yml up -d --build --wait
      - name: Execute three independent attempts
        env: {UI_BROWSER: '${{ matrix.browser }}'}
        shell: bash
        run: |
          source scripts/configure.sh
          chmod +x ui-automation/mvnw
          failed=0
          for attempt in 1 2 3; do
            ui-automation/mvnw -f ui-automation/pom.xml -Pintegration clean test || failed=1
            mkdir -p "results/${UI_BROWSER}-${attempt}"
            cp -r ui-automation/target/surefire-reports "results/${UI_BROWSER}-${attempt}/"
            cp -r ui-automation/target/allure-results "results/${UI_BROWSER}-${attempt}/"
            rm -rf ui-automation/target/surefire-reports ui-automation/target/allure-results
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'ui-${{ matrix.browser }}', path: results/}
      - name: Teardown owned environment
        if: always()
        run: docker compose -f ui-automation/docker-compose.yml down -v
  reliability:
    if: always()
    needs: browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'ui-*', path: results, merge-multiple: true}
      - name: Report actual rate against 95 percent
        run: python3 scripts/summarize_results.py results --expected-runs 6 --enforce | tee summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ui-pass-rate, path: summary.json}
